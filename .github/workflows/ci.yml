name: CI

on:
  push:
  pull_request:

jobs:
  test:
    # ubuntu-latest (26.04) no longer ships Python 3.9 in setup-python.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install . pytest
      - run: python -m pytest -q

  readme-examples:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Re-run every README example and diff against the pasted output
        run: |
          ./examples/readme_examples.sh
          git diff --exit-code examples/expected
